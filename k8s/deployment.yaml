apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-explorer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-explorer
  template:
    metadata:
      labels:
        app: travel-explorer
    spec:
      containers:
        - name: travel-explorer
          image: adityakarmalkar/travel-explorer:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
